<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#04070a"/>
<link rel="apple-touch-icon" href="../apple-touch-icon.png"/>
<link rel="icon" href="../favicon-32.png"/>
<title>Epicardial Pacing — CICU Monitor Deck</title>
<style>
:root{
  --bg:#04070a; --panel:#0a1017; --panel2:#0d151d; --grid:#0f1c26;
  --ecg:#25f4a0; --spo2:#22d3ee; --abp:#ff3b47; --amber:#ffb020;
  --violet:#b98bff; --ink:#e7f0f4; --dim:#5f7683; --line:#16242f;
  --FND:#25f4a0; --SEN:#22d3ee; --CAP:#ffb020; --MOD:#b98bff; --TRB:#ff3b47; --SAF:#9fb2bd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.led{width:9px;height:9px;border-radius:50%;background:var(--ecg);box-shadow:0 0 10px var(--ecg);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.title{font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.title b{color:var(--ink);font-weight:600}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ecg);font-size:13px;letter-spacing:.08em}

/* ecg strip */
.strip{height:46px;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,
  var(--panel);
  border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.strip svg{position:absolute;inset:0;width:200%;height:100%;animation:sweep 6s linear infinite}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* vitals row = channel legend + progress */
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.v{background:var(--panel);padding:9px 12px}
.v .lab{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.v .num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.v.due .num{color:var(--abp)} .v.new .num{color:var(--spo2)} .v.done .num{color:var(--ecg)}

/* channel chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{font-size:10px;letter-spacing:.06em;padding:5px 9px;border-radius:2px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:1px}
.chip.on{color:var(--ink);border-color:currentColor}
.chip small{color:var(--dim);font-variant-numeric:tabular-nums}

/* card */
.stage{flex:1;display:flex;flex-direction:column;padding:16px 14px 10px}
.card{flex:1;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:300px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--ecg));box-shadow:0 0 14px var(--accent,var(--ecg))}
.chan{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px dashed var(--line)}
.chan .name{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,var(--ecg))}
.chan .lead{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.1em}
.qa{padding:20px 18px;display:flex;flex-direction:column;gap:16px;flex:1;overflow-y:auto}
.qlabel{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.q{font-size:17px;line-height:1.5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.divider{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.a{font-size:15px;line-height:1.6;color:#cfe1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.a.hidden{filter:blur(9px);opacity:.28;pointer-events:none;user-select:none}
.tapflip{position:absolute;inset:auto 0 0 0;height:0}

/* controls */
.reveal{margin:12px 0 2px;width:100%;padding:15px;border:none;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:13px;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer}
.reveal:active{transform:scale(.99)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 2px}
.g{padding:13px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-family:inherit;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:3px}
.g .k{font-size:16px;font-weight:600}
.g .t{font-size:9px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.g .iv{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.g.again{border-color:#3a1418}.g.again .k{color:var(--abp)}
.g.hard{border-color:#3a2c12}.g.hard .k{color:var(--amber)}
.g.good{border-color:#123a2a}.g.good .k{color:var(--ecg)}
.g.easy{border-color:#152f3a}.g.easy .k{color:var(--spo2)}
.g:active{transform:scale(.97)}
.hint{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.06em;padding:6px 0 14px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 20px}
.done h2{margin:0;color:var(--ecg);letter-spacing:.1em;font-size:16px}
.done p{margin:0;color:var(--dim);font-size:13px;line-height:1.6}
.btn{padding:12px 20px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;
  font-family:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.foot{display:flex;gap:10px;padding:8px 14px 16px;align-items:center}
.foot .btn{font-size:10px;padding:9px 12px}
.foot .sp{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.08em}
@media (max-width:400px){.q{font-size:16px}.grades{gap:6px}.g .t{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="led"></span>
    <span class="title"><b>EPICARDIAL PACING</b> · CICU DECK</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="strip">
    <svg viewBox="0 0 440 46" preserveAspectRatio="none">
      <path id="ecgpath" fill="none" stroke="var(--ecg)" stroke-width="1.6"
        d="M0,23 L30,23 L36,20 L42,26 L48,23 L60,23 L64,10 L68,40 L72,6 L76,30 L82,23 L120,23 L126,20 L132,26 L138,23 L150,23 L154,10 L158,40 L162,6 L166,30 L172,23 L210,23 L216,20 L222,26 L228,23 L240,23 L244,10 L248,40 L252,6 L256,30 L262,23 L300,23 L306,20 L312,26 L318,23 L330,23 L334,10 L338,40 L342,6 L346,30 L352,23 L390,23 L396,20 L402,26 L408,23 L420,23 L424,10 L428,40 L432,6 L436,30 L440,23"/>
    </svg>
  </div>

  <div class="vitals">
    <div class="v due"><div class="lab">Due</div><div class="num" id="vDue">0</div></div>
    <div class="v new"><div class="lab">New</div><div class="num" id="vNew">0</div></div>
    <div class="v done"><div class="lab">Reviewed</div><div class="num" id="vDone">0</div></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <button class="btn" id="resetBtn">Reset progress</button>
    <span class="sp" id="statLine"></span>
  </div>
</div>

<script>
const CARDS = [{"ch": "FND", "q": "Standard epicardial wire configuration after cardiac surgery, and where do the wires emerge?", "a": "Two wires on the RA and two on the RV. RA wires emerge through skin to the RIGHT of the sternum; RV wires to the LEFT. Each wire is lightly sutured to myocardium at one end."}, {"ch": "FND", "q": "Haemodynamic benefit of preserving atrial contraction (atrial / AV-sequential pacing vs ventricular-only)?", "a": "Atrial contraction augments ventricular preloading and can raise cardiac output by up to ~25%. Matters most in reduced ventricular compliance (ischaemia, hypertrophy), where loss of atrial kick markedly drops CO."}, {"ch": "FND", "q": "Southampton wire colour convention and does polarity within a pair matter?", "a": "Blue = ventricle, white = atrium. Which wire of a pair goes to the +ve or -ve port is of no consequence (same for both chambers). But you MUST confirm A and V leads are in the correct ports."}, {"ch": "FND", "q": "Default mode and rate when the external box is switched on, and typical mode/rate leaving theatre?", "a": "Default: DDD at 60 with preset sensing/output for a standard patient. Most patients leave theatre DDD at 80–90 to optimise CO. Chronic AF may be VVI or DVI instead."}, {"ch": "SEN", "q": "Define sensitivity in temporary pacing.", "a": "The minimum intrinsic signal amplitude (mV) the pacemaker will register as a sensed event. It is the input/detection side of the box (contrast with output/capture)."}, {"ch": "SEN", "q": "Relationship between the sensitivity NUMBER and how sensitive the box is?", "a": "Inverse. A LOWER number = MORE sensitive (detects smaller signals). Think of the number as fence height: lower fence, more beats get seen. So 1 mV is more sensitive than 5 mV."}, {"ch": "SEN", "q": "How do you measure the sensing threshold at the bedside?", "a": "Demand mode (AAI/VVI/DDD), rate set BELOW intrinsic. Increase the number (less sensitive) until the sense indicator stops flashing and the box paces asynchronously — don't sustain (R-on-T risk). Then decrease the number until the indicator flashes with each P/R wave; the first value at which sensing returns is the sensing threshold."}, {"ch": "SEN", "q": "Where should sensitivity be set relative to the measured threshold, and why?", "a": "At roughly HALF the sensing threshold. This gives margin to detect abnormally small signals and to compensate for peri-lead fibrosis reducing the signal over time. E.g. threshold 4 mV → set ~2 mV."}, {"ch": "SEN", "q": "What sensitivity is set when there is NO intrinsic rhythm?", "a": "The threshold can't be measured, so sensitivity is set empirically to ~2 mV."}, {"ch": "SEN", "q": "OVERSENSING — cause direction, consequence, and fix?", "a": "Cause: number too LOW / too sensitive. Box sees T waves, R waves, myopotentials or diathermy and treats them as intrinsic beats → INAPPROPRIATE INHIBITION → pauses/asystole (dangerous if pacing-dependent). Fix: RAISE the number (make it less sensitive); remove the interfering source."}, {"ch": "SEN", "q": "UNDERSENSING — cause direction, consequence, and fix?", "a": "Cause: number too HIGH / not sensitive enough. Intrinsic beats missed → box paces regardless → competing/asynchronous spikes → R-on-T risk. Fix: LOWER the number (more sensitive); if it persists the electrogram is too small → check lead contact, switch to the other wire pair."}, {"ch": "SEN", "q": "Why are asynchronous (OO) modes chosen when diathermy is in use?", "a": "In demand modes, diathermy can be OVERSENSED and inhibit output — dangerous with no underlying rhythm. AOO/VOO/DOO have no sensing at all, so they pace regardless of interference."}, {"ch": "SEN", "q": "Which pacing modes have NO sensing function?", "a": "The 'OO' asynchronous modes: AOO, VOO, DOO. The third NBG letter O = no response to sensing."}, {"ch": "CAP", "q": "Define the capture (stimulation) threshold.", "a": "The minimum pacemaker OUTPUT required to reliably depolarise the myocardium (produce an action potential). This is the output side — distinct from the sensing threshold."}, {"ch": "CAP", "q": "Method to measure the ventricular capture threshold?", "a": "Set VVI, rate ~10 bpm above the patient's rate, output 2.5 V. Slowly decrease output until capture is lost, then increase until capture returns — that value is the capture threshold."}, {"ch": "CAP", "q": "Safe output setting once the capture threshold is known?", "a": "5.0 V OR 3× the threshold, whichever is GREATER. Keep output ≥5 V unless special circumstances dictate otherwise."}, {"ch": "CAP", "q": "Electrical capture vs mechanical capture — why does it matter?", "a": "An electrical spike/depolarisation on ECG does NOT guarantee myocardial contraction. Always confirm mechanical capture with a mechanical signal — arterial pressure trace or pulse oximeter waveform — not the ECG alone."}, {"ch": "CAP", "q": "Time course of capture-threshold rise, and figures for wire failure?", "a": "Thresholds rise from inflammation at the wire–myocardium interface, accelerated by higher energy. Notable rise commonly after ~4 days; failure to pace in >60% of right and >80% of left atrial wires by day 5 — hence day 4–5 is when permanent pacing is considered."}, {"ch": "CAP", "q": "Why must you NOT check the capture threshold if there is no underlying rhythm?", "a": "Losing capture during the test may be impossible to reverse (no fallback rhythm). Instead, watch for occasional MISSED BEATS as the warning sign of a rising threshold."}, {"ch": "MOD", "q": "What do the first three positions of the NBG code denote?", "a": "Position 1 = chamber PACED, Position 2 = chamber SENSED, Position 3 = RESPONSE to sensing (I inhibited, T triggered, D dual, O none). Only these first 3 are relevant to temporary epicardial pacing (O/A/V/D)."}, {"ch": "MOD", "q": "Describe DDD behaviour.", "a": "Waits for intrinsic atrial event; if none, paces the atrium. Then waits for intrinsic ventricular event (after the atrial event, paced or sensed); if none, paces the ventricle. Ventricular pacing can TRACK atrial activity above the lower rate limit."}, {"ch": "MOD", "q": "Why is DDD problematic in rapid atrial arrhythmia, and what is preferred?", "a": "DDD tracks the fast atrial rate and paces the ventricle too rapidly. DDI (or mode-switch) is preferred as it does not track the atrium."}, {"ch": "MOD", "q": "AAI — indication and contraindications?", "a": "Indication: relative bradycardia with intact, reliable AV conduction and an atrial rhythm too slow to compete. Contraindicated in AF/flutter and atrial tachycardia (can't capture atrium) and in AV node block."}, {"ch": "MOD", "q": "VVI — indication and key limitation?", "a": "Indication: when atrial pacing is futile, e.g. AF. Same as AAI but sensing/pacing in the ventricle. Limitation: no atrial contribution to ventricular preload (loss of atrial kick)."}, {"ch": "MOD", "q": "DOO — its two notable specific indications?", "a": "(1) AV-sequential pacing when a synchronous mode is contraindicated (e.g. diathermy) in a patient who benefits from atrial kick. (2) Emergency management of pacemaker-mediated tachycardia."}, {"ch": "TRB", "q": "The three categories of temporary pacing failure?", "a": "1) Failure to CAPTURE (spike present, no myocardial response). 2) Failure to SENSE (under- or over-sensing). 3) Failure to OUTPUT (no spike at all)."}, {"ch": "TRB", "q": "Stepwise approach to FAILURE TO CAPTURE?", "a": "1) Confirm — put monitor in pacemaker/spike-enhanced mode. 2) Increase output to max. 3) Reversible causes: hyperkalaemia, acidosis, hypoxia, antiarrhythmics, hypothermia. 4) Circuit: connections, wire integrity, battery; try reversing polarity or the other wire pair. 5) No rhythm = emergency → transcutaneous pacing + defibrillator ready."}, {"ch": "TRB", "q": "First monitor-related step when a pacing spike appears absent on a digital ECG?", "a": "Select the pacemaker/spike-enhanced monitor mode. Digital high-frequency filters strip the brief pacing spike, so 'no spike' may be an artefact of filtering rather than true failure to output."}, {"ch": "TRB", "q": "Managing UNDERSENSING?", "a": "Increase sensitivity (LOWER the number). If it persists, the intrinsic electrogram is too small → check lead contact/position and switch to the alternate wires. Beware competing spikes / R-on-T while unresolved."}, {"ch": "TRB", "q": "Managing OVERSENSING?", "a": "Decrease sensitivity (RAISE the number). Identify the source — T waves, diathermy, myopotentials, external interference. If the patient is pacing-dependent or diathermy is in use, switch to an asynchronous mode (VOO/DOO)."}, {"ch": "TRB", "q": "Causes of FAILURE TO OUTPUT (no spike at all)?", "a": "Box off or locked; flat battery; loose or fractured wire/connection; or oversensing masquerading as no-output (box thinks it sees intrinsic activity and inhibits)."}, {"ch": "TRB", "q": "'Box appears dead' — quickest checks?", "a": "Is it ON and UNLOCKED? These boxes must be ON to program and are then LOCKED with the yellow key button — a seemingly dead box may just be off or locked. Then check battery and connections."}, {"ch": "SAF", "q": "Microshock risk with epicardial wires and the precautions?", "a": "Wires are low-resistance connections directly to the heart → microshock can precipitate arrhythmia, especially VF. Handle only with non-conductive gloves; discharge static on a large metal object (e.g. the bed) first; insulate wires in a non-conductive container when unused; nurse in a cardiac-protected environment."}, {"ch": "SAF", "q": "Minimum monitoring for any patient with temporary pacing?", "a": "Continuous ECG monitoring PLUS immediate access to a cardiac defibrillator with transcutaneous pacing capability (because of failure/arrhythmia risk)."}, {"ch": "SAF", "q": "Rationale for 'back-up' pacing at a rate of 40?", "a": "Lets the patient stay in their intrinsic rhythm until significant haemodynamic compromise, while allowing the sensing threshold to be continuously monitored — so full pacing can be resumed with confidence the threshold hasn't become excessive."}, {"ch": "SAF", "q": "Epicardial wire removal — timing, technique, and what to observe for?", "a": "Usually ~day 4 on the surgeon's instruction (by CICU nurses). Constant gentle traction; if caught by a tight suture, pull as far as safe then cut close to skin (ends retract — no adverse effect). Observe a few hours for: tamponade, ventricular arrhythmia, damage to coronary anastomoses."}, {"ch": "SAF", "q": "Heparin protocol around wire removal?", "a": "Stop heparin, remove wires after 2 hours (no APTR check needed). Remove the Redivac drain 1 hour later if no pericardial bleeding, then restart heparin immediately. Checking an APTR only delays removal — high-risk in mechanical-valve patients."}, {"ch": "SAF", "q": "IABP + pacing interaction and how to avoid it?", "a": "If the IABP triggers off the ECG, pacing spikes can be misread as QRS complexes. Keep the high-frequency filter ON, or time the IABP off the arterial waveform instead."}, {"ch": "SAF", "q": "Risk factors for needing a PERMANENT pacemaker after cardiac surgery?", "a": "Older age, pre-operative bundle branch block, prolonged CPB, and suboptimal intra-operative myocardial protection. Common indications: CHB, sinus node dysfunction, slow ventricular response in AF, Mobitz II with inadequate rate."}, {"ch": "SEN", "q": "Terminology pitfall: what exactly is the value found when the sense indicator first flashes again?", "a": "It is the SENSING threshold (the smallest signal reliably sensed) — NOT the capture/stimulation threshold. Keep the two distinct: sensing = input side, capture = output side. (The Southampton page loosely calls it the 'pacing threshold'.)"}];
const CH = {
  FND:{name:"Fundamentals",lead:"WIRES",col:"var(--FND)"},
  SEN:{name:"Sensing Voltage",lead:"SENS",col:"var(--SEN)"},
  CAP:{name:"Capture Threshold",lead:"OUTPUT",col:"var(--CAP)"},
  MOD:{name:"Modes / NBG",lead:"MODE",col:"var(--MOD)"},
  TRB:{name:"Troubleshooting",lead:"ALARM",col:"var(--TRB)"},
  SAF:{name:"Safety & Practical",lead:"SAFE",col:"var(--SAF)"},
};
const KEY="epipace_srs_v1";
const DAY=86400000, now=()=>Date.now();

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let state=load();
CARDS.forEach((c,i)=>{ if(!state[i]) state[i]={ef:2.5,reps:0,intv:0,due:0,seen:false}; });
save(state);

let activeCh=new Set(Object.keys(CH));   // all channels on by default
let sessionDone=0;
let current=null, revealed=false;

// SM-2
function schedule(i,q){ // q: 0 again,1 hard,2 good,3 easy
  const s=state[i];
  if(q===0){ s.reps=0; s.intv=0; s.due=now()+ (revealAgainMin()*60000); }
  else{
    s.reps+=1;
    if(s.reps===1) s.intv=(q===1?1:q===3?4:1);
    else if(s.reps===2) s.intv=(q===1?3:6);
    else s.intv=Math.round(s.intv*s.ef*(q===1?0.6:q===3?1.3:1));
    s.ef=Math.max(1.3, s.ef + (0.1 - (3-q)*(0.08+(3-q)*0.02)));
    s.due=now()+s.intv*DAY;
  }
  s.seen=true; save(state);
}
function revealAgainMin(){return 5}
function intervalLabel(i,q){
  const s=state[i]; if(q===0) return "5m";
  let intv;
  const reps=s.reps+1;
  if(reps===1) intv=(q===1?1:q===3?4:1);
  else if(reps===2) intv=(q===1?3:6);
  else intv=Math.round(s.intv*s.ef*(q===1?0.6:q===3?1.3:1));
  return intv>=1?intv+"d":"1d";
}

function queue(){
  const t=now();
  const due=[], fresh=[];
  CARDS.forEach((c,i)=>{
    if(!activeCh.has(c.ch)) return;
    const s=state[i];
    if(!s.seen) fresh.push(i);
    else if(s.due<=t) due.push(i);
  });
  due.sort((a,b)=>state[a].due-state[b].due);
  return {due,fresh,all:due.concat(fresh)};
}

function counts(){
  const t=now(); let due=0,nw=0,done=0;
  CARDS.forEach((c,i)=>{ if(!activeCh.has(c.ch))return; const s=state[i];
    if(!s.seen) nw++; else if(s.due<=t) due++; else done++; });
  return {due,nw,done};
}

function renderChips(){
  const box=document.getElementById('chips'); box.innerHTML='';
  Object.keys(CH).forEach(k=>{
    const n=CARDS.filter(c=>c.ch===k).length;
    const el=document.createElement('div');
    el.className='chip'+(activeCh.has(k)?' on':'');
    el.style.color=CH[k].col.replace('var(--','var(--'); // keep
    el.innerHTML=`<span class="dot" style="background:${CH[k].col}"></span>${CH[k].name} <small>${n}</small>`;
    el.onclick=()=>{ if(activeCh.has(k)){ if(activeCh.size>1) activeCh.delete(k);} else activeCh.add(k); renderChips(); next(); };
    box.appendChild(el);
  });
}

function renderVitals(){
  const c=counts();
  document.getElementById('vDue').textContent=c.due;
  document.getElementById('vNew').textContent=c.nw;
  document.getElementById('vDone').textContent=c.done;
  const total=CARDS.filter(x=>activeCh.has(x.ch)).length;
  const mature=CARDS.filter((x,i)=>activeCh.has(x.ch)&&state[i].intv>=7).length;
  document.getElementById('statLine').textContent=`session ${sessionDone} · mature ${mature}/${total}`;
}

function cardHTML(i){
  const c=CARDS[i], meta=CH[c.ch];
  return `<div class="card" style="--accent:${meta.col}">
    <div class="chan"><span class="dot" style="width:9px;height:9px;border-radius:1px;background:${meta.col}"></span>
      <span class="name">${meta.name}</span><span class="lead">LEAD ${meta.lead} · #${i+1}/${CARDS.length}</span></div>
    <div class="qa">
      <div><div class="qlabel">Prompt</div><div class="q">${escapeHTML(c.q)}</div></div>
      <div class="divider"></div>
      <div><div class="qlabel">Response</div><div class="a hidden" id="ans">${escapeHTML(c.a)}</div></div>
    </div></div>`;
}
function escapeHTML(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function controlsHTML(i){
  return `<button class="reveal" id="revealBtn">Reveal response ⏎ / space</button>
  <div class="hint">tap card to flip</div>`;
}
function gradesHTML(i){
  return `<div class="grades">
    <button class="g again" data-q="0"><span class="k">1</span><span class="t">Again</span><span class="iv">${intervalLabel(i,0)}</span></button>
    <button class="g hard"  data-q="1"><span class="k">2</span><span class="t">Hard</span><span class="iv">${intervalLabel(i,1)}</span></button>
    <button class="g good"  data-q="2"><span class="k">3</span><span class="t">Good</span><span class="iv">${intervalLabel(i,2)}</span></button>
    <button class="g easy"  data-q="3"><span class="k">4</span><span class="t">Easy</span><span class="iv">${intervalLabel(i,3)}</span></button>
  </div><div class="hint">keys 1–4 to grade</div>`;
}

function next(){
  renderChips(); renderVitals();
  const q=queue();
  const stage=document.getElementById('stage');
  if(q.all.length===0){
    current=null;
    stage.innerHTML=`<div class="done">
      <h2>◉ ALL CHANNELS STABLE</h2>
      <p>No cards due in the selected channels.<br>Next review scheduled by the SM-2 engine.<br>Toggle channels above or reset to run again.</p>
      <button class="btn" id="againAll">Study all now</button></div>`;
    document.getElementById('againAll').onclick=()=>{ // force-study: reset due to now for selected
      CARDS.forEach((c,i)=>{ if(activeCh.has(c.ch)) state[i].due=now(); });
      // keep seen so intervals persist but pull them up:
      CARDS.forEach((c,i)=>{ if(activeCh.has(c.ch)&&state[i].seen) state[i].due=now(); });
      save(state); next();
    };
    return;
  }
  current=q.all[0]; revealed=false;
  stage.innerHTML=cardHTML(current)+controlsHTML(current);
  const card=stage.querySelector('.card');
  card.addEventListener('click',reveal);
  document.getElementById('revealBtn').onclick=(e)=>{e.stopPropagation();reveal();};
}

function reveal(){
  if(revealed||!current&&current!==0) return;
  revealed=true;
  document.getElementById('ans').classList.remove('hidden');
  const btn=document.getElementById('revealBtn'); if(btn) btn.remove();
  const hint=document.querySelector('.hint'); if(hint) hint.remove();
  const stage=document.getElementById('stage');
  const holder=document.createElement('div'); holder.id='gradeHolder';
  holder.innerHTML=gradesHTML(current); stage.appendChild(holder);
  holder.querySelectorAll('.g').forEach(b=>b.onclick=()=>grade(+b.dataset.q));
}

function grade(q){
  if(!revealed) return;
  schedule(current,q); sessionDone++;
  next();
}

document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Reset all spaced-repetition progress for this deck?')){
    state={}; CARDS.forEach((c,i)=>state[i]={ef:2.5,reps:0,intv:0,due:0,seen:false});
    save(state); sessionDone=0; next();
  }
};

document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if((e.key===' '||e.key==='Enter')&&!revealed){e.preventDefault();reveal();return;}
  if(revealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();grade(+e.key-1);}
});

function tick(){const d=new Date();
  document.getElementById('clock').textContent=d.toTimeString().slice(0,8);}
setInterval(tick,1000); tick();

next();
</script>
</body>
</html>
